# 比較測試的設定（任務說明 apps/Cards/docs/tasks/rule-test-tool.md §4-2）。凍結後不改；同一課多跑幾份用 extend，加一課用 init --from。
# 測試資料夾與課庫都放在 repo 外面（教材、原稿與分數是私人資料）。
名稱: 改成這一輪的名稱
課庫: D:\改成課庫的資料夾          # 每課一個資料夾：教材.pdf、評分表.md
課:
  - 代號: 改成課的代號
    表單: { 科目: english, 年級學期: 國二上, 單元: "改成單元", 目的: 準備段考, 補充: 否, 點選填空: 要, 家長調整: 無, 教材說明: "" }
    已有目標: { vault: D:\改成孩子的 vault }   # 凍結時讀一次，只讀不寫
組:
  - 名稱: 現行
    規則: { 外掛: english }                    # 這個 commit 的外掛送什麼就送什麼
  - 名稱: 候選
    規則:
      commit: 改成規則檔所在的 commit
      檔案: [apps/Cards/docs/card-rules/next/core.md]
      任務段: { 點選填空說明: 送, 已有目標說明: 外掛原文, 三段: 不要, 已有目標清單: 原寫法 }
    加深規則: { commit: 改成規則檔所在的 commit, 檔案: [apps/Cards/docs/card-rules/next/core.md] }   # 跑加深時，檔案、自備來源一定要寫
生成:
  - { 生成器: claude, 模型: claude-opus-5-5, 推理: high, 份數: 3 }
評審:
  - { 評審: codex, 模型: gpt-6.2-sol, 推理: high }
  - { 評審: claude, 模型: claude-fable-5-2, 推理: high }
評審重評: 1
裁定: { 裁定者: claude, 模型: claude-opus-5-5, 推理: high }
門檻:
  基準: 現行
  候選: [候選]
  生成器: [claude]                             # 哪幾個生成器算門檻（其他只報告）
  重大錯誤: 不比基準多                         # 候選每份的平均不比基準多（D-234）；或「零」（每一份都要 0）
  # 指標照 tasks/rule-test-d236.md §7（D-236）：收益只收學習面的指標，至少一項明顯；列了 k 項時每一項用 5%÷k 判明顯。
  收益: [{ 指標: 傷到學習, 至少: 20% }, { 指標: 每個必備平均幾題, 至少: 10% }, { 指標: 加深機會漏掉, 至少: 20% }]
  收益校正: 要                                 # 要／不要（不要時每一項都用 5%）
  傷到學習容許: { 百分比: 0%, 下限: 0 }        # 第 3 道：候選每份平均最多多幾筆，預設一筆都不能多
  # 不能變差：學習面的指標全部自動進來，這裡只改容許量（百分比 × 基準平均和下限取大的），例如：
  # 不能變差: [{ 指標: 每個必備平均幾題, 容許: 10%, 下限: 0.2 }]
  多餘的題多出: 0                              # 近義重複的多餘的題，候選每份平均最多多幾題
  次要: [{ 指標: token, 至少: 10%, 容許: 10% }, { 指標: 規則字數, 至少: 10%, 容許: 10% }]   # 學習面打平時才看
  打平最少份數: 3
  打平較省: 過                                 # 過／只報告
  時間預算: 只報告                             # 只報告／算門檻：目標多超過 15% 而確定考到的必備沒多（檢查表課 3）
錯誤分級: { 一題多事: 小問題, 池裡判準不同: 小問題, 跨單元去向: 小問題 }   # 只有這三種能調：傷到學習或小問題
加深: { 生成器: [claude] }                     # 模擬首次加深（tasks/rule-test-d236.md §6）；手貼的不跑，不跑就刪掉這一行
# 對照：甲對乙只報告、不判過不過（§8），例如：
# 對照: [{ 名稱: 五步的效果, 甲: 現行＋五步, 乙: 現行 }]
