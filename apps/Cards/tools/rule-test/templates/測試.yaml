# 比較測試的設定（任務說明 apps/Cards/docs/tasks/rule-test-tool.md §4-2）。凍結後不改；同一課多跑幾份用 extend，加一課用 init --from。
# 測試資料夾與課庫都放在 repo 外面（教材、原稿與分數是私人資料）。
名稱: 改成這一輪的名稱
課庫: D:\改成課庫的資料夾          # 每課一個資料夾：教材.pdf、評分表.md
課:
  - 代號: 改成課的代號
    表單: { 科目: english, 年級學期: 國二上, 單元: "改成單元", 目的: 準備段考, 補充: 否, 點選填空: 要, 家長調整: 無, 教材說明: "" }
    已有目標: { vault: D:\改成孩子的 vault }   # 凍結時讀一次，只讀不寫
組:
  - 名稱: 現行
    規則: { 外掛: english }                    # 這個 commit 的外掛送什麼就送什麼
  - 名稱: 候選
    規則:
      commit: 改成規則檔所在的 commit
      檔案: [apps/Cards/docs/card-rules/next/core.md]
      任務段: { 點選填空說明: 送, 已有目標說明: 外掛原文, 三段: 不要, 已有目標清單: 原寫法 }
生成:
  - { 生成器: claude, 模型: claude-opus-5-5, 推理: high, 份數: 3 }
評審:
  - { 評審: codex, 模型: gpt-6.2-sol, 推理: high }
  - { 評審: claude, 模型: claude-fable-5-2, 推理: high }
評審重評: 1
裁定: { 裁定者: claude, 模型: claude-opus-5-5, 推理: high }
門檻:
  基準: 現行
  候選: [候選]
  生成器: [claude]                             # 哪幾個生成器算門檻（其他只報告）
  重大錯誤: 零                                 # 或「不比基準多」（改 D-228 的門檻要使用者同意）
  收益: [{ 指標: 規則字數, 至少: 20% }, { 指標: 孩子會碰到的錯, 至少: 20% }]
  不能變差: [{ 指標: 孩子會碰到的錯, 容許: 10% }]
