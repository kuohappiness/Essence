name: Check
on: [push, pull_request]
# 分派（D-208 第 5 點，tasks/one-repo-step-1.md §4；第二步 §A4 加共用工具；docs/tasks/ai-client.md〈8〉加套件）：plan 照分派表的 CI 跑法決定共用工具、哪幾個外掛與套件要跑；共用檢查每次都跑；
# gate 確認每個 job 都照 plan（要跑的成功、不跑的跳過），合併條件看 gate。
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.plan.outputs.tools }}
      cards: ${{ steps.plan.outputs.cards }}
      capture: ${{ steps.plan.outputs.capture }}
      mindboard: ${{ steps.plan.outputs.mindboard }}
      ai-client: ${{ steps.plan.outputs.ai-client }}
      reasons: ${{ steps.plan.outputs.reasons }}
      compare: ${{ steps.plan.outputs.compare }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 比較的端點由事件決定（PR 的分岔點、push 的上一次、分支和 origin/main 的合併基點），要完整的歷史。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 分派表不用 npm 套件，不必安裝。
      - id: plan
        run: node tools/ci-gate.ts plan

  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json
      # 共用檢查只裝 tools/ 的相依，不裝根目錄（D-208 第一步 §1）。
      - run: npm ci
        working-directory: tools
      - run: npm run check
        working-directory: tools

  # 共用工具自己的完整檢查（第二步 §A2）：型別、lint、knip 與 tools/tests/ 的測試。
  tools:
    needs: plan
    if: needs.plan.outputs.tools == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
        with:
          # hooks.test.ts 從這個 repo clone 出暫存 repo。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
      - run: npm run self-check

  cards:
    needs: plan
    if: needs.plan.outputs.cards == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/Cards
    steps:
      - uses: actions/checkout@v4
        with:
          # 發布前比較的跨版本測試要讀真正部署過的版本（tag）。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/Cards/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # 建置產物照 Linux 的規則（分大小寫）被 .gitignore 忽略，檢查與建置也沒留下別的檔（D-218 驗收第 16 項）。
      - run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - run: npm audit --omit=dev --audit-level=high

  capture:
    needs: plan
    if: needs.plan.outputs.capture == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/Capture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 直接 npm ci：鎖檔不存在、壞了或和 package.json 不同步都由 npm 擋下，不自己判斷「沒有相依」（L2 R5）。
      # 建置與 audit 等外掛有程式的第一個任務再加。
      - run: npm ci
      - run: npm run check

  mindboard:
    needs: plan
    if: needs.plan.outputs.mindboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/Mindboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check

  # 套件（tools/apps.ts 的 PACKAGES，docs/tasks/ai-client.md〈8〉）：型別、lint、knip 與離線測試；執行期零相依，不跑 audit。
  ai-client:
    needs: plan
    if: needs.plan.outputs.ai-client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ai-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/ai-client/package-lock.json
      - run: npm ci
      - run: npm run check

  # 要跑的 job 被跳過時，其他 job 都是綠的，只有這裡擋得到。main 之後要設必過檢查時只設這個 job（2026-11-17 查過，現在沒設）。
  gate:
    needs: [plan, shared, tools, cards, capture, mindboard, ai-client]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/ci-gate.ts gate
        env:
          NEEDS: ${{ toJSON(needs) }}
