name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 發布前比較的跨版本測試要讀真正部署過的版本（tag）。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/package-lock.json
      # 共用檢查的相依在 tools/ 自己的 package.json（D-208 第一步 §1）；Cards 的檢查兩邊都要裝。
      - run: npm ci
        working-directory: tools
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
