# 開發進度畫板：docs/progress-map.md 或 backlog（最上層與外掛的，數補測列）改了就產生網頁、發布到 GitHub Pages（清單 progress-map-list.html、畫布 progress-map-board.html，在 https://kuohappiness.github.io/Essence/ 底下）。
# 進度白板（roadmap.html）：roadmap、入口文件或決策紀錄（最上層與外掛的 docs/ 底下）改了也重新產生，同一站一起發布（tools/roadmap-board.ts）。
# 網頁只在這裡產生、直接發布，不 commit 進 repo。第一次要在 repo 的 Settings → Pages 把 Source 設成 GitHub Actions。
name: Progress board
on:
  push:
    branches: [main]
    paths:
      # 白板的狀態板、〈已完成〉由入口的狀態行同步而來，「最近定案」讀決策紀錄與各站的「來自」「→」（D-214、D-217）：
      # 最上層與外掛的 docs/ 底下任何一份改了都可能改變白板。
      - docs/**
      - apps/*/docs/**
      - tools/check-docs.ts
      - tools/decisions.ts
      - tools/status-line.ts
      - tools/progress-board*.ts
      - tools/roadmap-board.ts
      - tools/apps.ts
      - tools/package-lock.json
      - .github/workflows/progress-board.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json
      # 產生網頁只用共用工具的相依（tools/ 自己的 package.json，D-208 第一步 §1），不裝根目錄（Cards）。
      - run: npm ci
        working-directory: tools
      - run: node tools/progress-board.ts
      - run: node tools/roadmap-board.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # 發布偶爾遇到 GitHub 的暫時錯誤（剛上傳的產物抓不到中繼資料，訊息建議稍後重跑；2026-11-24～27 看過的失敗都是這種），
      # 失敗時等 30 秒再試一次；兩次都失敗時 job 紅燈，開場提醒（.claude/hooks/ci-status.mjs）會看到（D-245 第 4 點）。
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
