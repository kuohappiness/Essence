# 開發進度畫板：docs/progress-map.md 或 backlog（數補測列）改了就產生網頁、發布到 GitHub Pages（清單 progress-map-list.html、畫布 progress-map-board.html，在 https://kuohappiness.github.io/Essence/ 底下）。
# 進度白板（roadmap.html）：docs/roadmap.md 改了也重新產生，同一站一起發布（tools/roadmap-board.ts）。
# 網頁只在這裡產生、直接發布，不 commit 進 repo。第一次要在 repo 的 Settings → Pages 把 Source 設成 GitHub Actions。
name: Progress board
on:
  push:
    branches: [main]
    paths:
      - docs/progress-map.md
      - docs/backlog.md
      - docs/roadmap.md
      - plugins/*/docs/roadmap.md
      - tools/check-docs.ts
      - tools/progress-board*.ts
      - tools/roadmap-board.ts
      - tools/package-lock.json
      - .github/workflows/progress-board.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json
      # 產生網頁只用共用工具的相依（tools/ 自己的 package.json，D-208 第一步 §1），不裝根目錄（Cards）。
      - run: npm ci
        working-directory: tools
      - run: node tools/progress-board.ts
      - run: node tools/roadmap-board.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
